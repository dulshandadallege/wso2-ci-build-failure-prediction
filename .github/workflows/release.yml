name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: pip install -r requirements-dev.txt
      - name: Lint and test
        if: steps.version.outputs.exists == 'false'
        run: |
          ruff check src tests app
          pytest -q
      - name: Train model
        if: steps.version.outputs.exists == 'false'
        run: python -m src.train
      - name: Quality gate
        if: steps.version.outputs.exists == 'false'
        run: |
          python - <<'PY'
          import json
          m = json.load(open("reports/metrics.json"))
          base = m["failure_rate"]["test"]
          assert m["test"]["roc_auc"] >= 0.62, "ROC-AUC below gate"
          assert m["test"]["pr_auc"] >= base * 1.3, "PR-AUC not clearly above baseline"
          PY
      - name: SHAP figures
        if: steps.version.outputs.exists == 'false'
        run: python -m src.explain
      - name: Write release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          python - <<'PY'
          import json
          m = json.load(open("reports/metrics.json"))
          t = m["test"]
          lines = [
              f"Model: **{m['model']}**, decision threshold {m['threshold']:.2f}",
              "",
              f"Test period: {m['test_period'][0][:10]} to {m['test_period'][1][:10]} ({m['rows']['test']} builds, base failure rate {m['failure_rate']['test']:.1%})",
              "",
              "| ROC-AUC | PR-AUC | F1 | Precision | Recall |",
              "|---|---|---|---|---|",
              f"| {t['roc_auc']:.3f} | {t['pr_auc']:.3f} | {t['f1']:.3f} | {t['precision']:.3f} | {t['recall']:.3f} |",
              "",
              "Container image: `" + "${{ env.IMAGE }}:${{ steps.version.outputs.tag }}" + "`",
          ]
          open("release_notes.md", "w").write("\n".join(lines))
          PY
      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" \
            models/model.joblib reports/metrics.json reports/test_results.csv reports/validation_results.csv \
            --title "Model ${{ steps.version.outputs.tag }}" --notes-file release_notes.md
      - name: Build and push container image
        if: steps.version.outputs.exists == 'false'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${{ steps.version.outputs.tag }}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
