name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint and test
        run: |
          ruff check src tests app
          pytest -q
      - name: Train model
        run: python -m src.train
      - name: Quality gate
        run: |
          python - <<'PY'
          import json
          m = json.load(open("reports/metrics.json"))
          base = m["failure_rate"]["test"]
          assert m["test"]["roc_auc"] >= 0.62, "ROC-AUC below gate"
          assert m["test"]["pr_auc"] >= base * 1.3, "PR-AUC not clearly above baseline"
          PY
      - name: SHAP figures
        run: python -m src.explain
      - name: Write release notes
        run: |
          python - <<'PY'
          import json
          m = json.load(open("reports/metrics.json"))
          t = m["test"]
          lines = [
              f"Model: **{m['model']}**, decision threshold {m['threshold']:.2f}",
              "",
              f"Test period: {m['test_period'][0][:10]} to {m['test_period'][1][:10]} ({m['rows']['test']} builds, base failure rate {m['failure_rate']['test']:.1%})",
              "",
              "| ROC-AUC | PR-AUC | F1 | Precision | Recall |",
              "|---|---|---|---|---|",
              f"| {t['roc_auc']:.3f} | {t['pr_auc']:.3f} | {t['f1']:.3f} | {t['precision']:.3f} | {t['recall']:.3f} |",
              "",
              "Container image: `" + "${{ env.IMAGE }}:${{ github.ref_name }}" + "`",
          ]
          open("release_notes.md", "w").write("\n".join(lines))
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            models/model.joblib reports/metrics.json reports/test_results.csv reports/validation_results.csv \
            --title "Model $GITHUB_REF_NAME" --notes-file release_notes.md
      - name: Build and push container image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"
