name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests app
      - name: Unit tests and quality gate
        run: pytest -v

  train-and-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train model
        run: python -m src.train --n-iter 10
      - name: Check metrics
        run: |
          python - <<'PY'
          import json
          m = json.load(open("reports/metrics.json"))
          base = m["failure_rate"]["test"]
          print(json.dumps(m, indent=2))
          assert m["test"]["roc_auc"] >= 0.62, "ROC-AUC below gate"
          assert m["test"]["pr_auc"] >= base * 1.3, "PR-AUC not clearly above baseline"
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: model
          path: |
            models/model.joblib
            reports/metrics.json
            reports/*.csv
      - name: Build Docker image
        run: docker build -t ci-failure-app .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8501:8501 ci-failure-app
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
